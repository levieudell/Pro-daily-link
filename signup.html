<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Start Pro Daily Link</title><link rel="stylesheet" href="signup.css"></head><body><main><header><img src="assets/pro-daily-link-logo.png"><p>Start your 14-day trial · no credit card</p></header><form id="signup"><section><span>1</span><h1>Create your company</h1><div class="two"><label>Company name<input id="company" required></label><label>Primary trade<input id="trade" placeholder="Concrete, general contractor…"></label><label>Your name<input id="owner" required></label><label>Email<input id="email" type="email" required></label><label>Number of employees<input id="employees" type="number" min="1" value="8"></label><label>Active projects<input id="projects" type="number" min="1" value="4"></label></div></section><section><span>2</span><h2>Choose your plan</h2><div class="plans"><label><input type="radio" name="plan" value="starter"><b>Starter</b><strong>$79/mo</strong><small>10 users · 5 active projects</small></label><label class="featured"><input type="radio" name="plan" value="growth" checked><b>Growth</b><strong>$179/mo</strong><small>30 users · 25 active projects</small></label><label><input type="radio" name="plan" value="pro"><b>Pro</b><strong>$349/mo</strong><small>75 users · unlimited projects</small></label></div><p id="recommendation"></p></section><button>Create company</button><div id="result"></div></form></main><script src="signup.js"></script></body></html>
