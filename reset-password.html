<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card"><div class="auth-heading"><p class="eyebrow">SECURE PASSWORD RESET</p><h1>Choose a new password</h1><p>This reset link works once and expires after 30 minutes.</p></div>
<form id="reset-form"><label>Email address<input id="email" type="email" autocomplete="username" required></label><label>New password<input id="password" type="password" minlength="12" autocomplete="new-password" placeholder="At least 12 characters" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="primary" type="submit">Reset password</button><p id="message" class="form-message" role="alert"></p></form>
</section><p class="back-link"><a id="back-login" href="/login.html">← Back to sign in</a></p>
</main><script src="reset-password.js"></script></body></html>
