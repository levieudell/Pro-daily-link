<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subcontractor Daily · Pro Daily Link</title><link rel="stylesheet" href="/guest.css"></head><body><main><header><img src="/assets/pro-daily-link-logo.png" alt="Pro Daily Link"><span>Secure subcontractor daily</span></header><section id="loading" class="card">Loading project access…</section><section id="guest-app" hidden><div class="project-card"><small id="company"></small><h1 id="project"></h1><p id="site"></p><div class="access"><strong id="subcontractor"></strong><span>Access limited to this project</span></div></div><form id="daily-form" class="card"><h2>Today’s progress</h2><p>A quick update for the office—no individual employee tracking.</p><div class="check-actions"><button type="button" id="arrived">We arrived</button><button type="button" id="finished" class="secondary">We’re done for today</button></div><div id="time-status">Tap “We arrived” when work begins.</div><div class="two tm-only"><label>Start time<input id="start" type="datetime-local" required></label><label>End time<input id="end" type="datetime-local" required></label></div><label>Approximate crew count<input id="crew" type="number" min="1" value="1" required></label><label>What did your crew complete?<textarea id="notes" rows="6" required></textarea></label><label class="tm-only">Materials used<textarea id="materials" rows="2"></textarea></label><label class="tm-only">Equipment used<textarea id="equipment" rows="2"></textarea></label><label>Delays, extra work, or issues<textarea id="delays" rows="2"></textarea></label><label>Progress photos<input id="photos" type="file" accept="image/jpeg,image/png,image/webp" multiple><small>Up to 8 photos, 6 MB each</small></label><label>Your name / signature<input id="signature" required></label><button id="submit" type="submit">Submit progress update</button><div id="message"></div></form></section></main><script src="/guest.js"></script></body></html>
