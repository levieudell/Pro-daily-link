services:
  - type: web
    name: pro-daily-link-demo
    runtime: node
    # Match the live service's 1 CPU / 2 GB compute plan. Leaving this at
    # `free` would let a future Blueprint sync silently downgrade production.
    plan: 1c-2g
    buildCommand: npm ci
    startCommand: npm start
    # Render restarts only a dead process. Operational readiness (database,
    # billing, email, Sentry, and verified backups) is monitored separately at
    # /api/health so a stale backup cannot create a destructive restart loop.
    healthCheckPath: /api/health/live
    envVars:
      - key: NODE_ENV
        value: production
      - key: PDL_REQUIRE_AUTH
        value: "1"
      - key: PDL_TRUST_PROXY_HOPS
        value: "1"
      - key: PDL_SUPABASE_ENABLED
        value: "1"
      # Repository cutovers are intentionally configured in Render instead of
      # hard-coded here: off -> shadow -> verified primary. `sync: false`
      # keeps the current reviewed value during future Blueprint syncs.
      - key: PDL_TRANSACTIONAL_DB
        sync: false
      - key: PDL_PLATFORM_TRANSACTIONAL_DB
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      # Independent target binding for production-only recovery and cutover
      # commands. This is the 20-character project ref, never a URL or key.
      - key: PDL_PRODUCTION_SUPABASE_PROJECT_REF
        sync: false
      # DER/SPKI Ed25519 public key (base64). The independent backup runner
      # keeps the private signing key; production can verify but cannot forge.
      - key: PDL_RECOVERY_ATTESTATION_PUBLIC_KEY
        sync: false
      - key: PDL_PUBLIC_URL
        value: https://app.prodailylink.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Pro Daily Link <support@prodailylink.com>
      - key: RESEND_REPLY_TO
        value: support@prodailylink.com
      # Non-secret operator rotation labels bind independent verification to
      # the exact runtime credential generation without hashing credentials.
      - key: PDL_RESEND_RUNTIME_KEY_VERSION
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: PDL_STRIPE_RUNTIME_KEY_VERSION
        sync: false
      - key: PDL_STRIPE_WEBHOOK_SECRET_VERSION
        sync: false
      # Dedicated portal configurations are validated before every portal
      # session and by the independent provider-readiness monitor.
      - key: STRIPE_PORTAL_CONFIG_STANDARD
        sync: false
      - key: STRIPE_PORTAL_CONFIG_FOUNDER
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FOUNDER_STARTER
        sync: false
      - key: STRIPE_PRICE_FOUNDER_STARTER_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FOUNDER_GROWTH
        sync: false
      - key: STRIPE_PRICE_FOUNDER_GROWTH_ANNUAL
        sync: false
      - key: STRIPE_PRICE_FOUNDER_PRO
        sync: false
      - key: STRIPE_PRICE_FOUNDER_PRO_ANNUAL
        sync: false
      - key: STRIPE_PRICE_ASSISTED_SETUP
        sync: false
      - key: STRIPE_PRODUCT_STARTER
        sync: false
      - key: STRIPE_PRODUCT_GROWTH
        sync: false
      - key: STRIPE_PRODUCT_PRO
        sync: false
      - key: STRIPE_PRODUCT_FOUNDER_STARTER
        sync: false
      - key: STRIPE_PRODUCT_FOUNDER_GROWTH
        sync: false
      - key: STRIPE_PRODUCT_FOUNDER_PRO
        sync: false
      - key: STRIPE_PRODUCT_ASSISTED_SETUP
        sync: false
      # Only the independent provider monitor owns the matching private key.
      # Render verifies its signed, target-bound readiness receipt.
      - key: PDL_PROVIDER_ATTESTATION_PUBLIC_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PDL_SENTRY_RUNTIME_DSN_VERSION
        sync: false
