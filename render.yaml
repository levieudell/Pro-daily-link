services:
  - type: web
    name: pro-daily-link-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PDL_REQUIRE_AUTH
        value: "1"
      - key: PDL_SUPABASE_ENABLED
        value: "1"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: PDL_PUBLIC_URL
        value: https://pro-daily-link-demo.onrender.com
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        value: Pro Daily Link <support@prodailylink.com>
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_STARTER
        sync: false
      - key: STRIPE_PRICE_GROWTH
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

