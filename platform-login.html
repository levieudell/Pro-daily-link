<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Sign In · Pro Daily Link</title><link rel="stylesheet" href="signup.css"></head><body><main style="max-width:520px"><header><img src="assets/pro-daily-link-logo.png"><p>Platform Operations · internal staff only</p></header><form id="login"><section><h1>Platform sign in</h1><label>Email<input id="email" type="email" value="levi@prodailylink.com" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="message" role="alert"></p></section></form><form id="claim"><section><h2>First-time setup</h2><p><button type="button" id="initialize" class="secondary">Generate initial owner code</button></p><label>One-time setup code<input id="code" autocomplete="one-time-code"></label><label>Create password<input id="new-password" type="password" minlength="12" autocomplete="new-password"></label><button>Claim account</button><p id="claim-message" role="alert"></p></section></form></main><script>const $=s=>document.querySelector(s);async function call(path,body){const r=await fetch(path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);return d}$('#login').onsubmit=async e=>{e.preventDefault();$('#message').textContent='Signing in…';try{await call('/api/platform/auth/login',{email:$('#email').value,password:$('#password').value});location.href='/platform.html'}catch(x){$('#message').textContent=x.message}};$('#initialize').onclick=async()=>{try{const result=await call('/api/platform/auth/bootstrap',{});$('#code').value=result.setupCode;$('#claim-message').textContent='Initial code generated. Create your password now.';$('#initialize').hidden=true}catch(x){$('#claim-message').textContent=x.message}};$('#claim').onsubmit=async e=>{e.preventDefault();try{await call('/api/platform/auth/claim',{email:$('#email').value,setupCode:$('#code').value,password:$('#new-password').value});$('#claim-message').textContent='Password created. You can sign in now.'}catch(x){$('#claim-message').textContent=x.message}}</script></body></html>
