<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Sign In · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card">
<div class="auth-heading"><p class="eyebrow">PRO DAILY LINK · INTERNAL</p><h1>Platform Operations</h1><p>Authorized Pro Daily Link team members only.</p></div>
<form id="login"><label>Email address<input id="email" type="email" value="levi@prodailylink.com" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><div class="password-actions"><div class="password-icon-actions"><button id="toggle-password" class="icon-button" type="button" aria-label="Show password" title="Show password"><span aria-hidden="true">◉</span></button><button id="clear-password" class="icon-button" type="button" aria-label="Clear password" title="Clear password"><span aria-hidden="true">×</span></button></div><a href="/platform-forgot-password.html">Forgot password?</a></div><button class="primary" type="submit">Sign in</button><p id="message" class="form-message" role="alert"></p></form>
</section><p class="back-link"><a href="/">← Back to Pro Daily Link</a></p>
</main><script>const $=s=>document.querySelector(s);async function call(path,body){const r=await fetch(path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);return d}$('#toggle-password').onclick=()=>{const input=$('#password'),button=$('#toggle-password'),show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Hide password':'Show password');button.title=show?'Hide password':'Show password';button.querySelector('span').textContent=show?'◎':'◉'};$('#clear-password').onclick=()=>{$('#password').value='';$('#password').focus()};$('#login').onsubmit=async e=>{e.preventDefault();$('#message').textContent='Signing in…';try{await call('/api/platform/auth/login',{email:$('#email').value,password:$('#password').value});location.href='/platform.html'}catch(x){$('#message').textContent=x.message}}</script></body></html>
