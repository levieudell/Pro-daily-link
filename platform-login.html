<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Platform Sign In · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card">
<div class="auth-heading"><p class="eyebrow">PRO DAILY LINK · INTERNAL</p><h1>Platform Operations</h1><p>Authorized Pro Daily Link team members only.</p></div>
<form id="login"><label>Email address<input id="email" type="email" value="levi@prodailylink.com" autocomplete="username" required></label><label>Password<span class="password-control"><input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required><span class="password-field-icons"><button id="toggle-password" class="field-action" type="button" aria-label="Show password" title="Show password"><svg class="icon-show" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6S2 12 2 12Z"/><circle cx="12" cy="12" r="2.2"/></svg><svg class="icon-hide" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M3 3l18 18"/><path d="M9.9 5.6A10.8 10.8 0 0 1 12 5.5c6.5 0 10 6.5 10 6.5a18.4 18.4 0 0 1-3.4 4.1"/><path d="M6.1 6.8C3.6 8.7 2 12 2 12s3.5 6.5 10 6.5c1.6 0 3-.3 4.2-.9"/><path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg></button></span></span></label><a class="forgot-link" href="/platform-forgot-password.html">Forgot password?</a><button class="primary" type="submit">Sign in</button><p id="message" class="form-message" role="alert"></p></form>
</section><p class="back-link"><a href="/">← Back to Pro Daily Link</a></p>
</main><script>const $=s=>document.querySelector(s);async function call(path,body){const r=await fetch(path,{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}),d=await r.json();if(!r.ok)throw Error(d.error);return d}$('#toggle-password').onclick=()=>{const input=$('#password'),button=$('#toggle-password'),show=input.type==='password';input.type=show?'text':'password';button.setAttribute('aria-label',show?'Hide password':'Show password');button.title=show?'Hide password':'Show password';button.querySelector('.icon-show').hidden=show;button.querySelector('.icon-hide').hidden=!show};$('#login').onsubmit=async e=>{e.preventDefault();$('#message').textContent='Signing in…';try{await call('/api/platform/auth/login',{email:$('#email').value,password:$('#password').value});location.href='/platform.html'}catch(x){$('#message').textContent=x.message}}</script></body></html>
