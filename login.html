<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card">
<div class="auth-heading"><p class="eyebrow">SECURE COMPANY WORKSPACE</p><h1>Welcome back</h1><p>Sign in to continue to Pro Daily Link.</p></div>
<form id="login"><label>Email address<input id="email" type="email" autocomplete="username" placeholder="you@company.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><a class="forgot-link" id="forgot-link" href="/forgot-password.html">Forgot password?</a><button class="primary" type="submit">Sign in</button><p id="message" class="form-message" role="alert"></p></form>
<div class="divider"><span>New to Pro Daily Link?</span></div><a class="secondary" href="/signup.html">Create account</a>
</section><p class="back-link"><a href="/">← Back to Pro Daily Link</a></p>
</main>
<dialog id="setup-modal" aria-labelledby="setup-title"><div class="modal-card"><button id="close-setup" class="modal-close" type="button" aria-label="Close password setup">×</button><div class="modal-heading"><p class="eyebrow">FIRST-TIME SETUP</p><h2 id="setup-title">Create your password</h2><p>Temporary password accepted. Choose the password you’ll use from now on.</p></div><form id="claim"><input id="code" type="hidden"><label>Create password<input id="new-password" type="password" minlength="12" autocomplete="new-password" placeholder="At least 12 characters" required></label><label>Confirm password<input id="confirm-password" type="password" minlength="12" autocomplete="new-password" placeholder="Enter it again" required></label><button class="primary" type="submit">Save password and sign in</button><button id="cancel-setup" class="secondary" type="button">Cancel</button><p id="claim-message" class="form-message" role="alert"></p></form></div></dialog>
<script src="login.js?v=20260918-email-tenant-routing"></script></body></html>
