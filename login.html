<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card">
<div class="auth-heading"><p class="eyebrow">SECURE COMPANY WORKSPACE</p><h1>Welcome back</h1><p>Sign in to continue to Pro Daily Link.</p></div>
<form id="login"><label>Email address<input id="email" type="email" autocomplete="username" placeholder="you@company.com" required></label><label>Password<input id="password" type="password" autocomplete="current-password" placeholder="Enter your password" required></label><button class="primary" type="submit">Sign in</button><p id="message" class="form-message" role="alert"></p></form>
<div class="divider"><span>New to Pro Daily Link?</span></div><a class="secondary" href="/signup.html">Create account</a>
<details class="setup-panel"><summary>Have a one-time setup code?</summary><form id="claim"><p>Your company owner created your account. Finish setting it up here.</p><label>Setup code<input id="code" autocomplete="one-time-code" placeholder="Enter your setup code"></label><label>Create password<input id="new-password" type="password" minlength="12" autocomplete="new-password" placeholder="At least 12 characters"></label><label>Confirm password<input id="confirm-password" type="password" minlength="12" autocomplete="new-password" placeholder="Enter it again"></label><button class="primary" type="submit">Set password</button><p id="claim-message" class="form-message" role="alert"></p></form></details>
</section><p class="back-link"><a href="/">← Back to Pro Daily Link</a></p>
</main><script src="login.js"></script></body></html>
