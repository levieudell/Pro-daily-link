<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in · Pro Daily Link</title><link rel="stylesheet" href="signup.css"></head><body><main style="max-width:540px"><header><img src="assets/pro-daily-link-logo.png"><p>Secure company workspace</p></header><form id="login"><section><h1>Sign in</h1><p>Use the account your company owner created for you.</p><label>Email<input id="email" type="email" autocomplete="username" required></label><label>Password<input id="password" type="password" autocomplete="current-password" required></label><button>Sign in</button><p id="message" role="alert"></p><small>First time here? Use your one-time setup code below.</small></section></form><form id="claim"><section><h2>Set up your account</h2><label>One-time setup code<input id="code" autocomplete="one-time-code"></label><label>Create password<input id="new-password" type="password" minlength="12" autocomplete="new-password"></label><label>Confirm password<input id="confirm-password" type="password" minlength="12" autocomplete="new-password"></label><button>Set password</button><p id="claim-message" role="alert"></p></section></form><p style="text-align:center"><a href="/signup.html">Create a new company</a></p></main><script src="login.js"></script></body></html>
