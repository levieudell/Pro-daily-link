name: Founder billing checks
on:
  pull_request:
    paths:
      - '**.js'
      - 'package*.json'
      - '.github/workflows/founder-billing.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: node --check signup.js
      - run: node founder-billing.test.js
      - run: npm test
