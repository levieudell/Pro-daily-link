name: Founder billing checks
on:
  pull_request:
    paths:
      - '**.js'
      - 'package*.json'
      - '.github/workflows/founder-billing.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Install the field browser driver
        run: npm install --no-save --no-package-lock puppeteer-core@25.14.0
      - name: Prepare field browser screenshots
        run: sudo mkdir -p /opt/cursor/artifacts/screenshots && sudo chmod -R a+rwx /opt/cursor
      - run: npm run check
      - run: npm run test:release-safety
      - run: node --check signup.js
      - run: node founder-billing.test.js
      - run: npm test
