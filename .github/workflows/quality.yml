name: Quality and security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test application
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run security:scan

  sql-conflicts:
    name: Test SQL revision conflicts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install isolated SQL test runtime
        run: npm install --prefix "$RUNNER_TEMP/pdl-sql-tests" --ignore-scripts --no-audit --no-fund --no-package-lock @electric-sql/pglite@0.5.8
      - name: Verify fresh and guarded upgrade SQL
        env:
          PDL_SQL_TEST_RUNTIME: ${{ runner.temp }}/pdl-sql-tests
        run: node revision-conflict-sql.test.cjs

