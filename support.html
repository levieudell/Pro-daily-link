<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audited Support Session</title><link rel="stylesheet" href="platform.css"></head><body><main style="margin:0;max-width:900px;margin:auto"><div id="support-banner" class="code">Validating support access…</div><section class="metrics" id="support-summary"></section><article><h2>Restricted support view</h2><p>This session shows account health only. Customer project contents, financial details, files, and reports are not exposed by this support view.</p></article></main><script>const token=new URLSearchParams(location.search).get('token');const banner=document.querySelector('#support-banner'),summary=document.querySelector('#support-summary');function addText(parent,tag,text){const node=document.createElement(tag);node.textContent=String(text??'');parent.append(node);return node}fetch('/api/support-session/'+encodeURIComponent(token||'')).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);banner.replaceChildren();addText(banner,'strong','SUPPORT ACCESS ACTIVE');addText(banner,'p',`${d.banner.actorName} is viewing ${d.banner.companyName}`);addText(banner,'small',`Reason: ${d.banner.reason} · Expires ${new Date(d.banner.expiresAt).toLocaleString()}`);summary.replaceChildren();for(const[key,value]of Object.entries(d.summary).filter(([key])=>key!=='onboarding')){const metric=document.createElement('div');metric.className='metric';addText(metric,'small',key.toUpperCase());addText(metric,'strong',value);summary.append(metric)}}).catch(error=>{banner.textContent=error.message})</script></body></html>
