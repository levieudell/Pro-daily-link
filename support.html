<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Audited Support Session</title><link rel="stylesheet" href="platform.css"></head><body><main style="margin:0;max-width:900px;margin:auto"><div id="support-banner" class="code">Validating support access…</div><section class="metrics" id="support-summary"></section><article><h2>Restricted support view</h2><p>This session shows account health only. Customer project contents, financial details, files, and reports are not exposed by this support view.</p></article></main><script>const token=new URLSearchParams(location.search).get('token');fetch('/api/support-session/'+token).then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error);document.querySelector('#support-banner').innerHTML='<strong>SUPPORT ACCESS ACTIVE</strong><p>'+d.banner.actorName+' is viewing '+d.banner.companyName+'</p><small>Reason: '+d.banner.reason+' · Expires '+new Date(d.banner.expiresAt).toLocaleString()+'</small>';document.querySelector('#support-summary').innerHTML=Object.entries(d.summary).filter(x=>x[0]!=='onboarding').map(x=>'<div class="metric"><small>'+x[0].toUpperCase()+'</small><strong>'+x[1]+'</strong></div>').join('')}).catch(e=>document.querySelector('#support-banner').textContent=e.message)</script></body></html>
