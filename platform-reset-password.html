<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose Platform Password · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card"><div class="auth-heading"><p class="eyebrow">PRO DAILY LINK · INTERNAL</p><h1>Choose a new password</h1><p>Use at least 12 characters. This link works once and expires after 30 minutes.</p></div>
<form id="reset"><label>New password<input id="password" type="password" minlength="12" autocomplete="new-password" required></label><label>Confirm password<input id="confirm" type="password" minlength="12" autocomplete="new-password" required></label><button class="primary" type="submit">Save new password</button><p id="message" class="form-message" role="alert"></p></form>
</section><p class="back-link"><a href="/platform-login.html">← Back to platform sign in</a></p>
</main><script>const $=s=>document.querySelector(s),params=new URLSearchParams(location.search),token=params.get('token')||'';$('#reset').onsubmit=async e=>{e.preventDefault();if($('#password').value!==$('#confirm').value){$('#message').textContent='Passwords do not match.';return}const button=e.submitter;button.disabled=true;$('#message').textContent='Saving…';try{const r=await fetch('/api/platform/auth/reset',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({token,password:$('#password').value})}),d=await r.json();if(!r.ok)throw Error(d.error);location.href='/platform-login.html?reset=1'}catch(x){$('#message').textContent=x.message;button.disabled=false}}</script></body></html>
