<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Reset Platform Password · Pro Daily Link</title><link rel="stylesheet" href="login.css"></head>
<body><main class="auth-shell">
<a class="brand" href="/" aria-label="Pro Daily Link home"><img src="assets/pro-daily-link-logo.png" alt="Pro Daily Link"></a>
<section class="auth-card"><div class="auth-heading"><p class="eyebrow">PRO DAILY LINK · INTERNAL</p><h1>Reset your password</h1><p>We’ll email a secure, one-time link to an active Platform Operations account.</p></div>
<form id="forgot"><label>Email address<input id="email" type="email" value="levi@prodailylink.com" autocomplete="email" required></label><button class="primary" type="submit">Email reset link</button><p id="message" class="form-message" role="status"></p></form>
</section><p class="back-link"><a href="/platform-login.html">← Back to platform sign in</a></p>
</main><script>const $=s=>document.querySelector(s);$('#forgot').onsubmit=async e=>{e.preventDefault();const button=e.submitter;button.disabled=true;$('#message').textContent='Sending…';try{const r=await fetch('/api/platform/auth/forgot',{method:'POST',credentials:'include',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:$('#email').value})}),d=await r.json();if(!r.ok)throw Error(d.error);$('#message').textContent='If that account is active, a reset link is on its way.'}catch(x){$('#message').textContent=x.message}finally{button.disabled=false}}</script></body></html>
